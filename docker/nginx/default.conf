# Um único server para todos os hosts (admin.* e {tenant}.*): a identificação
# do tenant é feita pelo Laravel a partir do Host.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 25m;

    root /var/www/backend/public;

    # Backend Laravel: API, Sanctum, Horizon e health check.
    location ~ ^/(api|sanctum|horizon|up)(/|$) {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_read_timeout 120s;
    }

    # Assets públicos do Horizon.
    location /vendor/ {
        try_files $uri =404;
    }

    # Tudo o resto: SPA servido pelo Vite (dev). Em produção, servir frontend/dist
    # com try_files $uri /index.html (ou /central.html no host admin).
    location / {
        proxy_pass http://node:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
