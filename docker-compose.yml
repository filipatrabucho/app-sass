# Ambiente local de desenvolvimento.
# App:    http://demo.nossaapp.localhost:8080   (tenant demo)
# Painel: http://admin.nossaapp.localhost:8080  (painel central)
# Email:  http://localhost:8025                 (Mailpit)
name: rh-platform

x-php: &php
  build:
    context: ./docker/php
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: rh-platform-php
  volumes:
    - ./backend:/var/www/backend
  depends_on:
    mariadb:
      condition: service_healthy
    redis:
      condition: service_started
  environment:
    DB_HOST: mariadb
    REDIS_HOST: redis
    MAIL_HOST: mailpit

services:
  app:
    <<: *php

  # Workers das filas (Horizon). Dashboard: http://admin.nossaapp.localhost:8080/horizon
  queue:
    <<: *php
    command: php artisan horizon
    restart: unless-stopped

  # Comandos agendados (ex.: integrations:sync-employees na Fase 5).
  scheduler:
    <<: *php
    command: php artisan schedule:work
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/backend:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - node

  node:
    image: node:22-alpine
    working_dir: /var/www/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_HMR_CLIENT_PORT: ${APP_PORT:-8080}
      VITE_CENTRAL_HOSTS: admin.nossaapp.localhost
    volumes:
      - ./frontend:/var/www/frontend
      - frontend_node_modules:/var/www/frontend/node_modules

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: central
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

volumes:
  mariadb_data:
  redis_data:
  frontend_node_modules:
